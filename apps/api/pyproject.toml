[project]
name = "vendoriq-api"
version = "0.1.0"
description = "VendorIQ API — FastAPI backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "vendoriq-scoring",
    "vendoriq-excel-import",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendoriq_api"]

[tool.uv.sources]
vendoriq-scoring = { workspace = true }
vendoriq-excel-import = { workspace = true }
