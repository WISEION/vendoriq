[project]
name = "vendoriq-worker"
version = "0.1.0"
description = "VendorIQ scheduled jobs — expiry reminders, adapter pulls, stale-profile scan"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "vendoriq-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendoriq_worker"]

[tool.uv.sources]
vendoriq-api = { workspace = true }
