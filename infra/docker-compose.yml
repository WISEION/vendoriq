# VendorIQ — one compose file, two profiles.
#
#   dev  (default)  docker compose --profile dev up      → http://localhost
#   prod            docker compose --profile prod up -d  → Caddy terminates TLS for DOMAIN
#
# The dev profile publishes the database, MinIO console and API ports so they can be reached
# from the host; the prod profile keeps everything behind Caddy.
name: vendoriq

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  AUTH_MODE: ${AUTH_MODE:-test}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vendoriq}:${POSTGRES_PASSWORD:-vendoriq}@db:5432/${POSTGRES_DB:-vendoriq}
  TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vendoriq}:${POSTGRES_PASSWORD:-vendoriq}@db:5432/${POSTGRES_DB:-vendoriq}_test
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in infra/.env}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-vendoriq}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-vendoriq}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vendoriq-secret}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@vendoriq.local}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-az}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:16-alpine
    profiles: [dev, prod]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vendoriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vendoriq}
      POSTGRES_DB: ${POSTGRES_DB:-vendoriq}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vendoriq}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: [dev, prod]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vendoriq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vendoriq-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    profiles: [dev, prod]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    # Migrations run at start-up so a clean clone comes up with a schema.
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn vendoriq_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Brief §7.1: a clean `docker compose up` serves the app *with seeded data*. Migrations run
  # in the api container; the rows are loaded here, once, after the API reports healthy — the
  # 13 real vendors and their real Rev4 outcomes, the removable demo layer, and the test
  # accounts without which nobody could log in to look at any of it.
  #
  # Dev only, deliberately. The demo layer and the AUTH_MODE=test accounts have no business in
  # a live system, so a production stack starts empty and is loaded on purpose (`make seed`).
  # The command is idempotent, so restarting the stack re-runs it harmlessly.
  seed:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    profiles: [dev]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    command: ["python", "-m", "vendoriq_api.seed", "load", "--real", "--demo"]
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    profiles: [dev, prod]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    profiles: [dev, prod]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [dev, prod]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-tls internal}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

  # Dev-only conveniences: reach the database, MinIO and the API without going through Caddy.
  db-ports:
    image: alpine/socat:latest
    profiles: [dev]
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:db:5432
    ports: ["5432:5432"]
    depends_on: [db]

  minio-ports:
    image: alpine/socat:latest
    profiles: [dev]
    command: tcp-listen:9001,fork,reuseaddr tcp-connect:minio:9001
    ports: ["9001:9001"]
    depends_on: [minio]

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
