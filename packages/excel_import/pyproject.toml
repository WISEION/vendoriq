[project]
name = "vendoriq-excel-import"
version = "0.1.0"
description = "VendorIQ Excel importer — 11-sheet application form and Rev4 scoring workbook"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openpyxl>=3.1",
    "vendoriq-scoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendoriq_excel_import"]

[tool.uv.sources]
vendoriq-scoring = { workspace = true }
