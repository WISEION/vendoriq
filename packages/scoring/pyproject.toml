[project]
name = "vendoriq-scoring"
version = "0.1.0"
description = "VendorIQ scoring & matching engine — pure Python, no framework dependencies"
requires-python = ">=3.11,<3.12"
# Intentionally empty: this package must import with the standard library alone.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendoriq_scoring"]

[tool.hatch.build.targets.wheel.force-include]
"vendoriq_scoring/models" = "vendoriq_scoring/models"
