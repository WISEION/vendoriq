[project]
name = "vendoriq"
version = "0.1.0"
description = "VendorIQ — vendor management & market intelligence (monorepo root)"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
    "openapi-spec-validator>=0.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/scoring", "packages/excel_import"]

[tool.uv.sources]
vendoriq-api = { workspace = true }
vendoriq-worker = { workspace = true }
vendoriq-scoring = { workspace = true }
vendoriq-excel-import = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "apps/web", "docs", "seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the documented pattern
    "RUF001", "RUF002", "RUF003",  # en dashes and Azerbaijani letters are intentional
]

[tool.ruff.lint.per-file-ignores]
"apps/api/alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []
# `apps/worker/tests` is excluded, and only for a mechanical reason worth stating: every
# workspace member on `mypy_path` contributes its `tests` directory under the same bare module
# name, so once phase 2G gave the worker a `conftest.py` alongside the API's, mypy saw two
# modules called `conftest`, declared a duplicate and refused to check the repository at all.
# Excluding the smaller of the two test trees restores checking everywhere else. The cost is
# real — the worker's tests are not type-checked — and the fix is a package layout that gives
# each member's tests a distinct import path, which is more churn than this run should spend.
exclude = ["^\\.venv/", "^apps/web/", "^docs/", "^apps/api/alembic/", "^apps/worker/tests/"]
mypy_path = "apps/api:apps/worker:packages/scoring:packages/excel_import"

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "openpyxl.*",
    "psycopg.*",
    "yaml",
    "openapi_spec_validator.*",
    # Optional dependencies: argon2-cffi is preferred but degrades to stdlib PBKDF2, and
    # boto3 only exists with the [s3] extra. Both are guarded by try/except ImportError.
    "argon2.*",
    "boto3",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/scoring/tests", "packages/excel_import/tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:vendoriq_.*"]
